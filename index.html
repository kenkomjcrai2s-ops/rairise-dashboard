<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>らいらいず 個人成績・段位進捗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK: スクリプトタグだけで動く軽量版) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --felt-1:#0b3d2e; --felt-2:#0e2f26; --felt-edge:#062018;
    --tile:#f6efdd; --tile-edge:#cdbb8e;
    --ink:#20281f; --ink-soft:#5b6357;
    --red:#a8322c; --green-dragon:#1f6b3a; --gold:#b8860b;
    --amber:#b3781f;
    --shadow: 0 6px 16px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.03), transparent 40%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 10px),
      linear-gradient(160deg, var(--felt-1), var(--felt-2) 60%, var(--felt-edge));
    min-height:100vh;
    padding-bottom:80px;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:36px 20px 0;}

  header.plaque{text-align:center;padding:38px 20px 24px;}
  .kanban{
    display:inline-block; background:var(--tile); border:1px solid var(--tile-edge);
    border-radius:10px; box-shadow: var(--shadow), inset 0 0 0 3px rgba(255,255,255,.4);
    padding:22px 48px; position:relative;
  }
  .kanban::before, .kanban::after{content:"";position:absolute;top:8px;bottom:8px;width:1px;background:rgba(0,0,0,.08);}
  .kanban::before{left:10px;} .kanban::after{right:10px;}
  .kanban h1{font-family:'Shippori Mincho', serif;font-weight:800;font-size:2.6rem;letter-spacing:.14em;margin:0;color:var(--ink);}
  .kanban .sub{margin-top:6px;font-size:.82rem;letter-spacing:.2em;color:var(--ink-soft);}
  .updated{margin-top:14px;font-size:.78rem;color:rgba(255,255,255,.55);letter-spacing:.05em;}

  /* ---- tabs ---- */
  .tabs{display:flex; justify-content:center; gap:8px; margin-bottom:30px;}
  .tabbtn{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#eef3ee;
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:.85rem;
    padding:10px 26px; border-radius:24px; cursor:pointer; letter-spacing:.1em;
  }
  .tabbtn.active{background:var(--tile); color:var(--ink); border-color:var(--tile);}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  .statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 34px;}
  .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 10px;text-align:center;color:#eef3ee;}
  .stat .n{font-family:'Shippori Mincho', serif;font-weight:700;font-size:1.5rem;color:#f6efdd;}
  .stat .l{font-size:.66rem;letter-spacing:.1em;color:rgba(255,255,255,.55);margin-top:2px;}

  h2.section-title{
    font-family:'Shippori Mincho', serif; color:#f6efdd; font-size:1.05rem;
    letter-spacing:.2em; text-align:center; margin:0 0 18px; opacity:.85;
  }
  h2.section-title .asof{
    display:block; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:400;
    letter-spacing:.05em; font-size:.68rem; color:rgba(255,255,255,.5);
    margin-top:6px;
  }

  .picker{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; margin-bottom:20px;}
  .picker select{
    background:var(--tile); border:1px solid var(--tile-edge); color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:.9rem;
    padding:9px 16px; border-radius:20px; cursor:pointer; min-width:220px;
  }

  .examcard{
    background:var(--tile); border:1px solid var(--tile-edge); border-radius:16px;
    box-shadow:var(--shadow); padding:26px 26px 22px; margin-bottom:46px;
  }
  .exam-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
  .exam-name{font-family:'Shippori Mincho', serif; font-weight:800; font-size:1.5rem;}
  .exam-badges{display:flex; gap:8px; flex-wrap:wrap;}
  .rankbadge{display:inline-block;font-size:.72rem;padding:4px 12px;border-radius:20px;color:#fff;font-weight:700;letter-spacing:.05em;}
  .statusbadge{display:inline-block;font-size:.72rem;padding:4px 12px;border-radius:20px;font-weight:700;letter-spacing:.05em;border:1.5px solid;}
  .statusbadge.ready{color:var(--green-dragon);border-color:var(--green-dragon);background:#e9f5ec;}
  .statusbadge.on_track{color:#1f6b3a;border-color:#1f6b3a;background:#eef7f0;}
  .statusbadge.behind{color:var(--amber);border-color:var(--amber);background:#fbf1e3;}
  .statusbadge.reset_pending{color:var(--red);border-color:var(--red);background:#fbeceb;}
  .statusbadge.not_started{color:var(--ink-soft);border-color:var(--ink-soft);background:#f1efe8;}
  .statusbadge.unranked{color:var(--ink-soft);border-color:var(--ink-soft);background:#f1efe8;}

  .exam-msg{font-size:.82rem; color:var(--ink-soft); margin-bottom:18px; line-height:1.6;}

  .tilewall{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:20px;}
  .tilewall .t{width:18px;height:24px;border-radius:3px;background:#efe6cd;border:1px solid var(--tile-edge);}
  .tilewall .t.done{background:var(--green-dragon);border-color:var(--green-dragon);}
  .tilewall .lbl{width:100%;font-size:.68rem;color:var(--ink-soft);margin-bottom:2px;}

  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .metric{background:rgba(0,0,0,.03);border:1px solid var(--tile-edge);border-radius:10px;padding:14px 16px;}
  .metric .mlabel{font-size:.7rem;color:var(--ink-soft);letter-spacing:.05em;margin-bottom:6px;display:flex;justify-content:space-between;}
  .metric .mval{font-family:'Shippori Mincho', serif;font-size:1.3rem;font-weight:700;}
  .metric .mval .req{font-size:.78rem;font-weight:500;color:var(--ink-soft);margin-left:6px;}
  .mtag{font-size:.66rem;padding:2px 8px;border-radius:12px;font-weight:700;}
  .mtag.clear{background:#e9f5ec;color:var(--green-dragon);}
  .mtag.notclear{background:#fbeceb;color:var(--red);}

  .pacebox{background:rgba(184,134,11,.08); border:1px dashed var(--gold); border-radius:10px; padding:12px 16px; font-size:.8rem; color:#6b5410; line-height:1.6;}
  .pacebox.placebox{background:rgba(31,107,58,.07); border:1px dashed var(--green-dragon); color:#204d2f; margin-top:8px;}

  .simulator{margin-top:16px; padding:16px 18px; border-radius:12px; border:2px solid var(--tile-edge); background:rgba(0,0,0,.03); transition: background .2s ease, border-color .2s ease;}
  .simulator.safe{background:rgba(31,107,58,.12); border-color:var(--green-dragon);}
  .simulator.unsafe{background:rgba(168,50,44,.10); border-color:var(--red);}
  .simulator .simtitle{font-size:.76rem; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:10px; font-weight:700;}
  .simulator .siminputs{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px;}
  .simulator .simcol{text-align:center;}
  .simulator .simcol label{display:block; font-size:.7rem; color:var(--ink-soft); margin-bottom:4px;}
  .simulator .simcol input{width:100%; text-align:center; font-family:'Shippori Mincho', serif; font-weight:700; font-size:1.1rem; padding:8px 4px; border-radius:8px; border:1px solid var(--tile-edge); background:var(--tile); color:var(--ink);}
  .simulator .simresult{font-size:.82rem; line-height:1.6; color:var(--ink);}
  .simulator .simresult b{font-family:'Shippori Mincho', serif; font-size:1.05rem;}
  .simulator .simreset{margin-top:8px; background:none; border:1px solid var(--ink-soft); color:var(--ink-soft); font-size:.7rem; padding:5px 12px; border-radius:14px; cursor:pointer;}

  .career{margin-top:18px; padding-top:16px; border-top:1px dashed var(--tile-edge); display:grid; grid-template-columns:repeat(4,1fr); gap:10px; font-size:.72rem; color:var(--ink-soft); text-align:center;}
  .career b{display:block; font-family:'Shippori Mincho', serif; font-size:1rem; color:var(--ink); font-weight:700;}

  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sortbtns{display:flex; gap:6px; flex-wrap:wrap;}
  .sortbtns button{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#eef3ee; font-family:'Zen Kaku Gothic New',sans-serif; font-size:.74rem; padding:7px 12px; border-radius:20px; cursor:pointer; letter-spacing:.05em; transition:.15s;}
  .sortbtns button:hover{background:rgba(255,255,255,.16);}
  .sortbtns button.active{background:var(--tile); color:var(--ink); border-color:var(--tile); font-weight:700;}
  .searchbox{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:20px; padding:7px 14px;}
  .searchbox input{background:transparent; border:none; outline:none; color:#f6efdd; font-size:.8rem; width:150px; font-family:'Zen Kaku Gothic New',sans-serif;}
  .searchbox input::placeholder{color:rgba(255,255,255,.4);}

  .board{background:rgba(0,0,0,.15); border-radius:14px; padding:8px; border:1px solid rgba(255,255,255,.08);}
  .row{display:grid; grid-template-columns:44px 1.3fr 78px 66px 60px 74px; align-items:center; gap:6px; background:var(--tile); border:1px solid var(--tile-edge); border-radius:8px; padding:11px 12px; margin-bottom:6px; font-size:.82rem; cursor:pointer; transition:transform .12s ease;}
  .row:hover{transform:translateX(2px);}
  .row.selected{outline:2px solid var(--gold);}
  .row.head{background:transparent;border:none;color:rgba(255,255,255,.5);font-size:.64rem;letter-spacing:.08em;padding:2px 12px 8px;margin-bottom:0;cursor:default;}
  .row.head:hover{transform:none;}
  .row .rk{font-family:'Shippori Mincho', serif;font-weight:800;font-size:.95rem;color:var(--ink-soft);text-align:center;}
  .row .nm{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .badge{justify-self:start;font-size:.66rem;padding:3px 9px;border-radius:20px;color:#fff;text-align:center;white-space:nowrap;}
  .row .num{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;}
  .row .st{justify-self:end;font-size:.62rem;padding:3px 8px;border-radius:12px;font-weight:700;text-align:center;white-space:nowrap;}
  .row .st.ready{background:#e9f5ec;color:var(--green-dragon);}
  .row .st.on_track{background:#eef7f0;color:#1f6b3a;}
  .row .st.behind{background:#fbf1e3;color:var(--amber);}
  .row .st.reset_pending{background:#fbeceb;color:var(--red);}
  .row .st.not_started{background:#f1efe8;color:var(--ink-soft);}
  .row .st.unranked{background:#f1efe8;color:var(--ink-soft);}

  .empty{text-align:center;color:rgba(255,255,255,.5);padding:40px;font-size:.85rem;}
  footer{text-align:center;color:rgba(255,255,255,.35);font-size:.7rem;margin-top:40px;letter-spacing:.05em;}

  /* ---- admin ---- */
  .loginbox{max-width:360px;margin:60px auto;background:var(--tile);border:1px solid var(--tile-edge);border-radius:14px;box-shadow:var(--shadow);padding:28px 26px;text-align:center;}
  .loginbox h3{font-family:'Shippori Mincho',serif;margin:0 0 16px;font-size:1.1rem;}
  .loginbox input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--tile-edge);font-size:.95rem;margin-bottom:12px;text-align:center;}
  .loginbox button{width:100%;padding:10px;border-radius:20px;border:none;background:var(--green-dragon);color:#fff;font-weight:700;cursor:pointer;font-size:.9rem;}
  .loginbox .err{color:var(--red);font-size:.75rem;margin-top:8px;min-height:1em;}

  .adminpanel .panelcard{background:var(--tile);border:1px solid var(--tile-edge);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:26px;}
  .adminpanel h3{font-family:'Shippori Mincho',serif;font-size:1.05rem;margin:0 0 16px;}
  .adminpanel .logoutbar{text-align:right;margin-bottom:16px;}
  .adminpanel .logoutbtn{background:none;border:1px solid rgba(255,255,255,.4);color:#eef3ee;font-size:.72rem;padding:6px 14px;border-radius:14px;cursor:pointer;}

  .seatgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
  .seat{border:1px solid var(--tile-edge);border-radius:10px;padding:12px;background:rgba(0,0,0,.03);}
  .seat label{display:block;font-size:.68rem;color:var(--ink-soft);margin-bottom:5px;}
  .seat select, .seat input{width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--tile-edge);font-size:.85rem;margin-bottom:8px;background:#fff;}
  .placebtns{display:flex;gap:4px;}
  .placebtns button{flex:1;padding:6px 0;border-radius:6px;border:1px solid var(--tile-edge);background:#fff;font-size:.78rem;cursor:pointer;font-weight:700;}
  .placebtns button.active{background:var(--gold);color:#fff;border-color:var(--gold);}

  .submitbtn{background:var(--green-dragon);color:#fff;border:none;padding:11px 26px;border-radius:20px;font-weight:700;cursor:pointer;font-size:.88rem;}
  .submitbtn:disabled{opacity:.4;cursor:not-allowed;}
  .warnline{font-size:.76rem;color:var(--red);margin:8px 0;min-height:1em;}
  .okline{font-size:.76rem;color:var(--green-dragon);margin:8px 0;min-height:1em;}

  .addmemberform{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
  .addmemberform > div{flex:1;min-width:140px;}
  .addmemberform label{display:block;font-size:.7rem;color:var(--ink-soft);margin-bottom:5px;}
  .addmemberform input, .addmemberform select{width:100%;padding:8px;border-radius:6px;border:1px solid var(--tile-edge);}

  .histlist{list-style:none;margin:0;padding:0;font-size:.78rem;}
  .histlist li{padding:8px 0;border-bottom:1px dashed var(--tile-edge);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .histlist .undobtn{background:none;border:1px solid var(--red);color:var(--red);border-radius:12px;padding:3px 10px;font-size:.7rem;cursor:pointer;}

  @media (max-width:720px){
    .statbar{grid-template-columns:repeat(2,1fr);}
    .metrics{grid-template-columns:1fr;}
    .career{grid-template-columns:repeat(2,1fr);}
    .row{grid-template-columns:30px 1fr 60px 60px;}
    .row .col-place, .row .col-status{display:none;}
    .row.head .col-place, .row.head .col-status{display:none;}
    .seatgrid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="plaque">
    <div class="kanban">
      <h1>らいらいず</h1>
      <div class="sub">個人 成績 ・ 段位 進捗</div>
    </div>
    <div class="updated" id="connStatus">Firestoreに接続中...</div>
  </header>

  <div class="tabs">
    <button class="tabbtn active" data-tab="viewer">メンバー成績</button>
    <button class="tabbtn" data-tab="admin">管理者</button>
  </div>

  <!-- ============ 閲覧タブ ============ -->
  <div class="tabpanel active" id="tab-viewer">

    <div class="statbar" id="statbar"></div>

    <h2 class="section-title">昇 段 診 断<span class="asof" id="dateAsOf"></span></h2>
    <div class="picker"><select id="playerSelect"></select></div>
    <div class="examcard" id="examcard"></div>

    <h2 class="section-title">らいらいずメンバー一覧</h2>
    <div class="controls">
      <div class="sortbtns" id="sortbtns"></div>
      <div class="searchbox"><input id="search" type="text" placeholder="名前で検索..."></div>
    </div>
    <div class="board">
      <div class="row head">
        <div>順</div><div>名前</div><div>段位</div>
        <div class="num col-place">平均着順</div><div class="num">半荘</div>
        <div class="col-status" style="text-align:right;">審査状況</div>
      </div>
      <div id="rows"></div>
    </div>
  </div>

  <!-- ============ 管理者タブ ============ -->
  <div class="tabpanel" id="tab-admin">
    <div id="loginArea">
      <div class="loginbox">
        <h3>管理者ログイン</h3>
        <input type="password" id="adminPass" placeholder="合言葉">
        <button id="loginBtn">ログイン</button>
        <div class="err" id="loginErr"></div>
      </div>
    </div>

    <div id="adminArea" class="adminpanel" style="display:none;">
      <div class="logoutbar"><button class="logoutbtn" id="logoutBtn">ログアウト</button></div>

      <div class="panelcard">
        <h3>半荘結果を入力</h3>
        <div class="seatgrid" id="seatgrid"></div>
        <div class="warnline" id="hanchanWarn"></div>
        <button class="submitbtn" id="submitHanchan">この半荘を登録する</button>
        <div class="okline" id="hanchanOk"></div>
      </div>

      <div class="panelcard">
        <h3>メンバーを追加</h3>
        <div class="addmemberform">
          <div><label>名前</label><input type="text" id="newMemberName" placeholder="例）たなか"></div>
          <div><label>初期段位</label>
            <select id="newMemberRank"></select>
          </div>
          <div><button class="submitbtn" id="addMemberBtn">追加</button></div>
        </div>
        <div class="okline" id="memberOk"></div>
        <div class="warnline" id="memberWarn"></div>
      </div>

      <div class="panelcard">
        <h3>直近の入力履歴（取り消し可能）</h3>
        <ul class="histlist" id="histList"><li>読み込み中...</li></ul>
      </div>

      <div class="panelcard">
        <h3>初回データ取込</h3>
        <p style="font-size:.8rem;color:var(--ink-soft);">
          Firestoreにまだデータが無い場合、同じフォルダに置いた <code>seed_data.json</code> から
          一括で初期データを取り込みます（既にメンバーが登録されている場合は何もしません）。
        </p>
        <button class="submitbtn" id="seedBtn">seed_data.json を取り込む</button>
        <div class="okline" id="seedOk"></div>
        <div class="warnline" id="seedWarn"></div>
      </div>
    </div>
  </div>

  <footer>らいらいず 個人成績管理 &mdash; Firestore連携版</footer>
</div>

<script>
/* =========================================================
   ここに、あなたが作成した Firebase プロジェクトの設定値を貼り付けてください。
   Firebaseコンソール →プロジェクトの設定→全般→マイアプリ で確認できます。
   ========================================================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

/* 管理者ログインの合言葉。運用開始前に必ず変更してください。 */
const ADMIN_PASSWORD = "CHANGE_ME_BEFORE_DEPLOY";

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const RANK_ORDER = ["5級","4級","3級","2級","1級","初段","二段","三段","四段","五段","六段","七段","八段","九段"];
const RANK_REQ = {
  "5級":{games:6,place:2.55,avg:250}, "4級":{games:6,place:2.5,avg:250},
  "3級":{games:6,place:2.45,avg:250}, "2級":{games:6,place:2.4,avg:260},
  "1級":{games:9,place:2.35,avg:270}, "初段":{games:12,place:2.3,avg:280},
  "二段":{games:12,place:2.3,avg:285}, "三段":{games:15,place:2.28,avg:285},
  "四段":{games:15,place:2.25,avg:290}, "五段":{games:15,place:2.2,avg:290},
  "六段":{games:18,place:2.17,avg:295}, "七段":{games:18,place:2.15,avg:300},
  "八段":{games:30,place:2.12,avg:300}, "九段":{games:30,place:2.1,avg:320},
};
const STATUS_LABEL = {
  ready:'合格ライン到達', on_track:'基準クリア中', behind:'追い上げ中',
  reset_pending:'要再挑戦', not_started:'審査開始前', unranked:'未認定',
};
const PLACE_LABEL = {1:'トップ', 2:'二着', 3:'三着', 4:'ラス'};

function r1(v){return Math.round(v*10)/10;}
function r2(v){return Math.round(v*100)/100;}
function r3(v){return Math.round(v*1000)/1000;}

/* ---- Firestoreの生データ(examWindow配列)から、表示用の進捗指標を算出 ---- */
function computeExam(p){
  const rank = p.rank;
  if(!rank || !RANK_ORDER.includes(rank)) return {rank:null, status:'unranked'};
  const win = p.examWindow || [];
  const played = win.length;
  const totalCurrent = win.reduce((a,g)=>a+g.score,0);
  const avgScore = played>0 ? r2(totalCurrent/played) : 0;
  const placeSum = win.reduce((a,g)=>a+g.place,0);
  const avgPlace = played>0 ? r3(placeSum/played) : null;
  const avoidCount = win.filter(g=>g.place!==4).length;
  const lastAvoidRate = played>0 ? r3(avoidCount/played) : null;

  const req = RANK_REQ[rank];
  const requiredGames = req.games, requiredPlace = req.place, requiredAvg = req.avg;
  const remainingGames = Math.max(requiredGames - played, 0);
  const placeClear = avgPlace!==null && avgPlace <= requiredPlace;
  const avgClear = played>0 && avgScore >= requiredAvg;
  const totalRequired = requiredAvg*requiredGames;
  const totalRemaining = Math.max(totalRequired-totalCurrent,0);
  const paceNeeded = remainingGames>0 ? r1(totalRemaining/remainingGames) : null;

  let status;
  if(played===0) status='not_started';
  else if(played>=requiredGames) status = (placeClear&&avgClear)?'ready':'reset_pending';
  else status = (placeClear&&avgClear)?'on_track':'behind';

  return {
    rank, rank_value: RANK_ORDER.indexOf(rank),
    required_games: requiredGames, required_place: requiredPlace, required_avg: requiredAvg,
    played_games: played, avg_place: avgPlace, avg_score: avgScore,
    place_sum: placeSum, last_avoid_rate: lastAvoidRate,
    remaining_games: remainingGames, place_clear: placeClear, avg_clear: avgClear,
    total_current: r1(totalCurrent), total_required: r1(totalRequired), total_remaining: r1(totalRemaining),
    pace_needed: paceNeeded, status,
  };
}

function toDisplayPlayer(key, p){
  const career = p.career || {gamesCount:0,placeSum:0,avoidCount:0,pointsSum:0,topCount:0};
  const games = career.gamesCount||0;
  return {
    key, name: p.name || key, rank: p.rank || "",
    rank_value: RANK_ORDER.includes(p.rank) ? RANK_ORDER.indexOf(p.rank) : -1,
    avg_place: games>0 ? r3(career.placeSum/games) : null,
    last_avoid_rate: games>0 ? r3(career.avoidCount/games) : null,
    top_count: career.topCount||0, games, points: career.pointsSum||0,
    examWindow: p.examWindow||[],
    exam: computeExam(p),
  };
}

function fmt(v, digits){ if(v===null||v===undefined||isNaN(v)) return '—'; return v.toFixed(digits); }
function fmtPts(v){ if(v===null||v===undefined) return '—'; const sign=v>0?'+':''; return sign+v.toFixed(1); }
function rankTier(rank){
  if(!rank) return '#8a6a3d';
  if(rank.includes('九段')) return '#a8322c';
  if(rank.includes('八段')||rank.includes('七段')) return '#b8860b';
  if(rank.includes('六段')||rank.includes('五段')) return '#8a6a20';
  if(rank.includes('段')) return '#1f6b3a';
  if(rank.includes('1級')||rank.includes('2級')) return '#5b6b7c';
  if(rank.includes('級')) return '#8a8a8a';
  return '#8a6a3d';
}

function placeExampleHtml(ex){
  const remaining = ex.remaining_games;
  const placeSum = ex.avg_place!==null ? ex.place_sum : 0;
  const budget = ex.required_place * ex.required_games - placeSum;
  if(budget < remaining * 1 - 1e-9){
    return `<div class="pacebox placebox">着順基準：残り${remaining}半荘では、全対局トップを取っても平均着順の基準到達は数値上厳しい状況です。早めのペースアップが必要です。</div>`;
  }
  if(budget >= remaining * 4 - 1e-9){
    return `<div class="pacebox placebox">着順基準：残り${remaining}半荘は着順を問わず基準内に収まります（ポイント基準のみ意識すればOK）。</div>`;
  }
  let lower = Math.floor(budget / remaining);
  lower = Math.max(1, Math.min(3, lower));
  const higher = lower + 1;
  let nHigher = Math.floor(budget - remaining * lower + 1e-9);
  nHigher = Math.max(0, Math.min(remaining, nHigher));
  const nLower = remaining - nHigher;
  const counts = {1:0,2:0,3:0,4:0};
  counts[lower]+=nLower; counts[higher]+=nHigher;
  const parts = [1,2,3,4].map(k => `${PLACE_LABEL[k]}${counts[k]}回`).join('　');
  return `<div class="pacebox placebox">着順基準：残り${remaining}半荘の一例として、<b>${parts}</b> のペースならセーフ（平均着順${ex.required_place}以内を維持できます）。</div>`;
}

function simulatorHtml(ex){
  if(!ex.remaining_games || ex.remaining_games<=0) return '';
  return `
  <div class="simulator" id="simulator">
    <div class="simtitle">着順基準シミュレーター　（残り ${ex.remaining_games} 半荘のうち、想定回数を入力）</div>
    <div class="siminputs">
      <div class="simcol"><label>トップ</label><input type="number" min="0" id="sim-1" value="0"></div>
      <div class="simcol"><label>二着</label><input type="number" min="0" id="sim-2" value="0"></div>
      <div class="simcol"><label>三着</label><input type="number" min="0" id="sim-3" value="0"></div>
      <div class="simcol"><label>ラス</label><input type="number" min="0" id="sim-4" value="0"></div>
    </div>
    <div class="simresult" id="simresult"></div>
    <button class="simreset" id="simreset">入力をリセット</button>
  </div>`;
}

function bindSimulator(ex){
  if(!ex.remaining_games || ex.remaining_games<=0) return;
  const ids=[1,2,3,4].map(k=>document.getElementById('sim-'+k));
  const box=document.getElementById('simulator');
  const resultEl=document.getElementById('simresult');
  const cap=ex.remaining_games;
  ids.forEach(el=>el.setAttribute('max',cap));

  function clampField(changedEl){
    let counts = ids.map(el=>Math.max(0, parseInt(el.value)||0));
    let total = counts.reduce((a,b)=>a+b,0);
    if(total>cap){
      const idx = ids.indexOf(changedEl);
      const excess = total-cap;
      counts[idx] = Math.max(0, counts[idx]-excess);
      changedEl.value = counts[idx];
    } else {
      changedEl.value = counts[ids.indexOf(changedEl)];
    }
    const nc = ids.map(el=>Math.max(0,parseInt(el.value)||0));
    const nt = nc.reduce((a,b)=>a+b,0);
    ids.forEach((el,i)=>el.setAttribute('max', cap-(nt-nc[i])));
  }
  function update(){
    const counts = ids.map(el=>Math.max(0,parseInt(el.value)||0));
    const entered = counts.reduce((a,b)=>a+b,0);
    const enteredSum = counts[0]*1+counts[1]*2+counts[2]*3+counts[3]*4;
    const combinedGames = (ex.played_games||0)+entered;
    const combinedSum = (ex.place_sum||0)+enteredSum;
    const combinedAvg = combinedGames>0 ? combinedSum/combinedGames : null;
    const clear = combinedGames>0 && combinedAvg<=ex.required_place;
    box.classList.remove('safe','unsafe'); box.classList.add(clear?'safe':'unsafe');
    let note = entered!==cap
      ? `<br><span style="opacity:.7;">入力合計 ${entered} / 残り${cap}半荘（あと${cap-entered}半荘分入力できます）</span>`
      : `<br><span style="opacity:.7;">入力合計 ${entered} / 残り${cap}半荘（上限まで入力済み）</span>`;
    resultEl.innerHTML = `入力後の平均着順：<b>${combinedGames>0?combinedAvg.toFixed(3):'—'}</b>　／　基準 ${ex.required_place}以内　→　`
      + (clear?'<b style="color:var(--green-dragon);">クリア</b>':'<b style="color:var(--red);">未達</b>') + note;
  }
  ids.forEach(el=>el.addEventListener('input', ()=>{clampField(el); update();}));
  document.getElementById('simreset').addEventListener('click', ()=>{ ids.forEach(el=>{el.value=0; el.setAttribute('max',cap);}); update(); });
  update();
}

function renderExamCard(){
  const p = players.find(x=>x.key===selectedKey);
  const el = document.getElementById('examcard');
  if(!p){ el.innerHTML = '<div class="empty">打ち手を選択してください</div>'; return; }
  const ex = p.exam;
  if(!ex || ex.status==='unranked'){
    el.innerHTML = `
      <div class="exam-head"><div class="exam-name">${p.name}</div>
      <div class="exam-badges"><span class="statusbadge unranked">未認定</span></div></div>
      <div class="exam-msg">まだ段位が設定されていません。対局を開始すると五級からの審査がスタートします。</div>`;
    return;
  }
  const tier = rankTier(ex.rank);
  const tiles = Array.from({length: ex.required_games}, (_,i)=>`<div class="t ${i<ex.played_games?'done':''}"></div>`).join('');

  let msg='';
  if(ex.status==='not_started') msg = `直近の昇段によりこの段位の判定はリセットされました。次の対局から ${ex.required_games} 半荘の審査が始まります。`;
  else if(ex.status==='ready') msg = `規定打数 ${ex.required_games} 半荘を消化し、平均着順・平均収支ともに基準を満たしています。昇段確定ラインに到達しました。`;
  else if(ex.status==='reset_pending') msg = `規定打数 ${ex.required_games} 半荘を消化しましたが、基準未達のため次の対局から打数がリセットされ再挑戦となります。`;
  else msg = `現在 ${ex.played_games} / ${ex.required_games} 半荘を消化中です。残り ${ex.remaining_games} 半荘で基準クリアを目指しましょう。`;

  const placeTag = ex.played_games>0 ? (ex.place_clear?'<span class="mtag clear">クリア中</span>':'<span class="mtag notclear">未達</span>') : '';
  const avgTag = ex.played_games>0 ? (ex.avg_clear?'<span class="mtag clear">クリア中</span>':'<span class="mtag notclear">未達</span>') : '';

  let paceHtml='';
  if(ex.remaining_games>0){
    paceHtml = ex.total_remaining>0
      ? `<div class="pacebox">残り <b>${ex.remaining_games}半荘</b> で、1半荘あたり平均 <b>${fmtPts(ex.pace_needed)}</b> 以上のペースが必要です。（不足累計: ${fmtPts(-ex.total_remaining)}）</div>`
      : `<div class="pacebox">必要累計ポイントは既に確保できています。残り <b>${ex.remaining_games}半荘</b> を消化すれば昇段判定です（平均着順の基準維持にご注意ください）。</div>`;
    paceHtml += placeExampleHtml(ex);
  }

  el.innerHTML = `
    <div class="exam-head"><div class="exam-name">${p.name}</div>
      <div class="exam-badges">
        <span class="rankbadge" style="background:${tier}">${ex.rank} 昇段審査中</span>
        <span class="statusbadge ${ex.status}">${STATUS_LABEL[ex.status]}</span>
      </div></div>
    <div class="exam-msg">${msg}</div>
    <div class="tilewall"><div class="lbl">半荘進捗　${ex.played_games} / ${ex.required_games}</div>${tiles}</div>
    <div class="metrics">
      <div class="metric"><div class="mlabel"><span>平均着順（${ex.required_place}以内）</span>${placeTag}</div>
        <div class="mval">${fmt(ex.avg_place,3)}<span class="req">/ 基準 ${ex.required_place}</span></div></div>
      <div class="metric"><div class="mlabel"><span>平均収支（${ex.required_avg}以上）</span>${avgTag}</div>
        <div class="mval">${fmt(ex.avg_score,1)}<span class="req">/ 基準 ${ex.required_avg}</span></div></div>
    </div>
    ${paceHtml}
    ${simulatorHtml(ex)}
    <div class="career">
      <div><b>${ex.played_games}</b>期間内半荘数</div>
      <div><b>${fmt(ex.avg_place,2)}</b>期間内平均着順</div>
      <div><b>${ex.last_avoid_rate!==null?Math.round(ex.last_avoid_rate*100)+'%':'—'}</b>期間内ラス回避率</div>
      <div><b>${fmtPts(ex.total_current)}</b>期間内ポイント</div>
    </div>`;
  bindSimulator(ex);
}

function validateHanchan(){
  const warnEl = document.getElementById('hanchanWarn');
  const submitBtn = document.getElementById('submitHanchan');
  const filled = seatState.every(s=>s && s.key && s.place && s.score!==null && s.score!==undefined);
  if(!filled){ warnEl.textContent=''; submitBtn.disabled=true; return false; }

  const keys = seatState.map(s=>s.key);
  if(new Set(keys).size !== 4){ warnEl.textContent='同じ打ち手を複数選択することはできません。'; submitBtn.disabled=true; return false; }

  const places = seatState.map(s=>s.place).sort();
  if(JSON.stringify(places) !== JSON.stringify([1,2,3,4])){ warnEl.textContent='着順はトップ・二着・三着・ラスをそれぞれ1人ずつ選んでください。'; submitBtn.disabled=true; return false; }

  const sum = seatState.reduce((a,s)=>a+s.score,0);
  if(Math.abs(sum) > 0.01){ warnEl.textContent = `参考: 4人の得点合計が0になっていません（現在 ${sum}）。ウマ・オカ精算後の値か確認してください。`; }
  else { warnEl.textContent=''; }

  submitBtn.disabled=false;
  return true;
}

document.getElementById('submitHanchan').addEventListener('click', async ()=>{
  if(!validateHanchan()) return;
  const submitBtn = document.getElementById('submitHanchan');
  submitBtn.disabled = true;
  const okEl = document.getElementById('hanchanOk');
  okEl.textContent = '登録中...';

  try{
    await db.runTransaction(async (tx)=>{
      const refs = seatState.map(s=>db.collection('players').doc(s.key));
      const snaps = await Promise.all(refs.map(r=>tx.get(r)));
      const historyEntries = [];

      snaps.forEach((snap, i)=>{
        const s = seatState[i];
        const data = snap.data();
        const beforeSnapshot = {
          rank: data.rank,
          examWindow: data.examWindow || [],
          career: data.career || {gamesCount:0,placeSum:0,avoidCount:0,pointsSum:0,topCount:0},
        };
        historyEntries.push({ playerKey: s.key, place: s.place, score: s.score, before: beforeSnapshot });

        const newWindow = [...beforeSnapshot.examWindow, {score: s.score, place: s.place}];
        const rank = data.rank;
        let finalRank = rank, finalWindow = newWindow;

        if(rank && RANK_ORDER.includes(rank)){
          const req = RANK_REQ[rank];
          const played = newWindow.length;
          if(played >= req.games){
            const placeSum = newWindow.reduce((a,g)=>a+g.place,0);
            const avgPlace = placeSum/played;
            const totalScore = newWindow.reduce((a,g)=>a+g.score,0);
            const avgScore = totalScore/played;
            const clear = avgPlace <= req.place && avgScore >= req.avg;
            if(clear){
              const idx = RANK_ORDER.indexOf(rank);
              finalRank = idx < RANK_ORDER.length-1 ? RANK_ORDER[idx+1] : rank;
            }
            finalWindow = []; // 規定打数消化 → 合否に関わらずリセット
          }
        }

        const career = beforeSnapshot.career;
        const newCareer = {
          gamesCount: (career.gamesCount||0)+1,
          placeSum: (career.placeSum||0)+s.place,
          avoidCount: (career.avoidCount||0)+(s.place!==4?1:0),
          pointsSum: r1((career.pointsSum||0)+s.score),
          topCount: (career.topCount||0)+(s.place===1?1:0),
        };

        tx.update(refs[i], { rank: finalRank, examWindow: finalWindow, career: newCareer });
      });

      const historyRef = db.collection('games').doc();
      tx.set(historyRef, { timestamp: firebase.firestore.FieldValue.serverTimestamp(), entries: historyEntries });
    });

    okEl.textContent = '登録しました！';
    seatState = [null,null,null,null];
    renderSeatGrid();
    document.getElementById('hanchanWarn').textContent='';
    loadHistory();
  } catch(e){
    okEl.textContent = '';
    document.getElementById('hanchanWarn').textContent = 'エラー: ' + e.message;
  }
  submitBtn.disabled = false;
});

/* ================= メンバー追加 ================= */
function fillRankSelect(){
  const sel = document.getElementById('newMemberRank');
  sel.innerHTML = RANK_ORDER.map(r=>`<option value="${r}" ${r==='5級'?'selected':''}>${r}</option>`).join('');
}
document.getElementById('addMemberBtn').addEventListener('click', async ()=>{
  const nameEl = document.getElementById('newMemberName');
  const rankEl = document.getElementById('newMemberRank');
  const okEl = document.getElementById('memberOk');
  const warnEl = document.getElementById('memberWarn');
  const name = nameEl.value.trim();
  okEl.textContent=''; warnEl.textContent='';
  if(!name){ warnEl.textContent='名前を入力してください。'; return; }
  if(players.find(p=>p.key===name)){ warnEl.textContent='同じ名前のメンバーが既に存在します。'; return; }
  try{
    await db.collection('players').doc(name).set({
      name, rank: rankEl.value, examWindow: [],
      career: {gamesCount:0,placeSum:0,avoidCount:0,pointsSum:0,topCount:0},
    });
    okEl.textContent = `「${name}」を追加しました。`;
    nameEl.value='';
  } catch(e){ warnEl.textContent = 'エラー: '+e.message; }
});

/* ================= 履歴・取り消し ================= */
async function loadHistory(){
  const listEl = document.getElementById('histList');
  try{
    const snap = await db.collection('games').orderBy('timestamp','desc').limit(5).get();
    if(snap.empty){ listEl.innerHTML = '<li>まだ入力履歴がありません。</li>'; return; }
    listEl.innerHTML = '';
    snap.forEach(doc=>{
      const d = doc.data();
      const t = d.timestamp ? d.timestamp.toDate().toLocaleString('ja-JP') : '(時刻不明)';
      const summary = (d.entries||[]).map(e=>`${e.playerKey}(${PLACE_LABEL[e.place]},${e.score>0?'+':''}${e.score})`).join(' / ');
      const li = document.createElement('li');
      li.innerHTML = `<span>${t}<br>${summary}</span><button class="undobtn" data-id="${doc.id}">取り消す</button>`;
      listEl.appendChild(li);
    });
    listEl.querySelectorAll('.undobtn').forEach(btn=>{
      btn.addEventListener('click', ()=>undoGame(btn.dataset.id));
    });
  } catch(e){
    listEl.innerHTML = `<li>読み込みエラー: ${e.message}</li>`;
  }
}

async function undoGame(gameId){
  if(!confirm('この半荘の登録を取り消しますか？（各打ち手の状態を直前の状態に戻します）')) return;
  try{
    await db.runTransaction(async (tx)=>{
      const gameRef = db.collection('games').doc(gameId);
      const gameSnap = await tx.get(gameRef);
      if(!gameSnap.exists) throw new Error('対象の履歴が見つかりません。');
      const entries = gameSnap.data().entries || [];
      entries.forEach(e=>{
        const ref = db.collection('players').doc(e.playerKey);
        tx.update(ref, { rank: e.before.rank, examWindow: e.before.examWindow, career: e.before.career });
      });
      tx.delete(gameRef);
    });
    loadHistory();
  } catch(e){ alert('取り消しに失敗しました: ' + e.message); }
}

let adminInited = false;
function refreshAdminSelectsIfNeeded(){
  if(!isAdmin()) return;
  if(!adminInited){
    fillRankSelect();
    adminInited = true;
  }
  renderSeatGrid();
  loadHistory();
}

/* ================= 初回データ取込 ================= */
document.getElementById('seedBtn').addEventListener('click', async ()=>{
  const okEl = document.getElementById('seedOk');
  const warnEl = document.getElementById('seedWarn');
  okEl.textContent=''; warnEl.textContent='';
  try{
    const existing = await db.collection('players').limit(1).get();
    if(!existing.empty){ warnEl.textContent = '既にメンバーが登録されているため、取込を中止しました（重複防止）。'; return; }

    const res = await fetch('seed_data.json');
    if(!res.ok) throw new Error('seed_data.json が同じフォルダに見つかりません。');
    const seed = await res.json();

    let batch = db.batch();
    let count = 0;
    for(const key of Object.keys(seed)){
      const p = seed[key];
      batch.set(db.collection('players').doc(key), {
        name: p.name, rank: p.rank, examWindow: p.examWindow,
        career: p.career,
      });
      count++;
      if(count % 400 === 0){ await batch.commit(); batch = db.batch(); }
    }
    await batch.commit();
    okEl.textContent = `${count}名分のデータを取り込みました。`;
  } catch(e){
    warnEl.textContent = 'エラー: ' + e.message;
  }
});
</script>
